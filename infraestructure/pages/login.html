<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="../assets/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header>
        <h1>Área de Login</h1>
        <nav id="menu">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="atividade-3.html">Atividade 3</a></li>
                <li><a href="sandbox.html">Sandbox</a></li>
                <li><a href="paleta.html">Paleta de Cores</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="login">
            <!-- novalidate: desativa o balão padrão do navegador para usarmos nosso próprio feedback de erro -->
            <form id="form-login" novalidate>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail:</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="seuemail@exemplo.com">
                    <!-- invalid-feedback só aparece quando o input ao lado recebe a classe is-invalid (login.js) -->
                    <div class="invalid-feedback" id="erro-email"></div>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha:</label>
                    <input type="password" id="senha" name="senha" class="form-control" required minlength="6" placeholder="Mínimo 6 caracteres">
                    <div class="invalid-feedback" id="erro-senha"></div>
                </div>

                <button type="submit" class="btn btn-success w-100">Entrar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Desenvolvido por Jefferson Batista &mdash; Projeto "Gameficação de Rotinas"</p>
    </footer>

    <script src="../assets/js/login.js"></script>
</body>
</html>
